[project]
name = "postgresql-with-python"
version = "0.1.0"
description = "PostgreSQL with Python: Advanced Relational Databases — Goliath Research Academy"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "marimo>=0.11.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "duckdb>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = [
    "3 - PostgreSQL SQL & Transactions",
]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
