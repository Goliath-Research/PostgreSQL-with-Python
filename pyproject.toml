[project]
name = "postgresql-with-python"
version = "0.1.0"
description = "PostgreSQL with Python: Analytics, ORM, and Database Applications — Goliath Research Academy"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "marimo>=0.11.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "duckdb>=2.0.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = [
    "1 - PostgreSQL Environment",
    "2 - Migrating the E-Commerce Database from SQLite to PostgreSQL",
    "3 - PostgreSQL SQL & Transactions",
    "4 - DuckDB PostgreSQL Connection",
]
python_files = ["test_*.py"]

[tool.pyrefly]
python-interpreter-path = ".venv/Scripts/python.exe"
search-path = [
    ".",
    "1 - PostgreSQL Environment",
    "2 - Migrating the E-Commerce Database from SQLite to PostgreSQL",
    "3 - PostgreSQL SQL & Transactions",
    "4 - DuckDB PostgreSQL Connection",
    "5 - Pythonic Relational Analytics",
    "6 - Analytical Reporting & Performance",
    "7 - SQLAlchemy Core & Connections",
    "8 - SQLAlchemy ORM Models",
    "9 - Sessions & Transactional Services",
    "10 - Migrations, Testing & Capstone",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [
    "1 - PostgreSQL Environment",
    "2 - Migrating the E-Commerce Database from SQLite to PostgreSQL",
    "3 - PostgreSQL SQL & Transactions",
    "4 - DuckDB PostgreSQL Connection",
    "5 - Pythonic Relational Analytics",
    "6 - Analytical Reporting & Performance",
    "7 - SQLAlchemy Core & Connections",
    "8 - SQLAlchemy ORM Models",
    "9 - Sessions & Transactional Services",
    "10 - Migrations, Testing & Capstone",
]

[tool.ruff]
line-length = 100
target-version = "py311"
